<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Zaras.wear</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="../static/assets/img/favicon.png" rel="icon">
  <link href="../static/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&family=Roboto:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet">

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>

  <link href="../static/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../static/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../static/assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="../static/assets/css/main.css" rel="stylesheet">
  <script src="../static/assets/js/main.js"></script>

</head>

<body>

  {% include 'navbar.html' %}

  <main id="main">
    <!-- Breadcrumbs -->
    <div class="breadcrumbs d-flex align-items-center"
      style="background-image: url('../static/assets/img/latar.png');">
      <div class="container position-relative d-flex flex-column align-items-center" data-aos="fade">
        <h2>Produk Dress</h2>
        <ol>
          <li><a href="/dress">Dress</a></li>
          <li>Dress</li>
        </ol>
      </div>
    </div>

    <!-- Product Search and List -->
    <section id="services" class="services section-bg">
      <div class="container" data-aos="fade-up">
        <div>
          <h2>Dress</h2>
          <div class="input-group mb-4 mt-4 w-50">
            <input id="searchProduct" type="text" class="form-control" placeholder="Cari produk..."
              aria-label="Cari produk" aria-describedby="button-addon2">
          </div>
        </div>
        </div>

        <div class="row gy-4" id="productList">
          {% for dress in dress %}
          <div class="col-lg-3 col-md-4 col-sm-6 product-item" data-name="{{ dress['name'] }}"
            data-category="{{ dress['category'] }}" data-aos="fade-up" data-aos-delay="100">
            <div class="card h-100">
              <img src="{{ url_for('static', filename='assets/img/'~ dress['image']) }}" class="card-img-top"
                alt="dress image">
              <div class="card-body mb-1">
                <span>{{ dress['category'] }}</span>
                <h5 class="card-title">{{ dress['name'] }}</h5>
                <div class="card-details mb-1">
                  <h6 class="card-price">Rp {{ dress['price'] }}</h6>
                </div>
                {% if is_logged_in() %}
                <button class="btn btn-warning btn-tambah-keranjang" data-product-id="{{ dress['_id'] }}"
                  data-product-name="{{ dress['name'] }}" data-product-price="{{ dress['price'] }}">
                  <i class="bi bi-cart"></i> Tambah ke Keranjang
                </button>
                {% else %}
                <a href="{{ url_for('login') }}" class="btn btn-warning">
                  <i class="bi bi-cart"></i> Tambah ke Keranjang
                </a>
                {% endif %}
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </section>
  </main>

  {% include 'footer.html' %}

  <a href="#" class="scroll-top d-flex align-items-center justify-content-center"><i
      class="bi bi-arrow-up-short"></i></a>

  <div id="preloader"></div>

  <script>
    $(document).ready(function () {
      $('#searchProduct').on('keyup', function () {
        let value = $(this).val().toLowerCase();
        $('#productList .product-item').filter(function () {
          $(this).toggle($(this).data('name').toLowerCase().indexOf(value) > -1 || $(this).data('category').toLowerCase().indexOf(value) > -1);
        });
      });
    })

    $(document).ready(function () {
      $('.btn-tambah-keranjang').on('click', function () {
        let productId = $(this).data('product-id');
        let quantity = 1; // Jumlah awal produk dalam keranjang
        let price = $(this).data('product-price');
        let name = $(this).data('product-name');

        $.ajax({
          type: 'POST',
          url: '/tambah_ke_keranjang',
          data: {
            'productId': String(productId),
            'quantity': quantity,
            'price': price,
            'name': name,

          },
          success: function (response) {
            if (response.status === 'success') {
              alert('Produk berhasil ditambahkan ke keranjang!');
            } else {
              alert('Gagal menambahkan produk ke keranjang: ' + response.message);
            }
          },
          error: function (xhr, status, error) {
            alert('Gagal menambahkan produk ke keranjang: ' + xhr.responseText);
            console.log('Status:', status);
            console.log('Error:', error);
            console.log('Response:', xhr.responseText);
          }
        });
      });
    });
  </script>



  <!-- Vendor JS Files -->
  <script src="../static/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../static/assets/vendor/aos/aos.js"></script>
  <script src="../static/assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="../static/assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="../static/assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="../static/assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="../static/assets/vendor/php-email-form/validate.js"></script>

  <!-- Template Main JS File -->

</body>

</html>
