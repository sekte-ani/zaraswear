<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/styleProd.css') }}"> -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <!-- Favicons -->
  <link href="{{ url_for('static', filename='img/logo_white.png') }}" rel="icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/dashboard.css') }}">

</head>

<body>
  {% include 'sidebar.html' %}

  <div class="container-fluid">
    <!-- Bagian Dress -->
    <div class="mt-4">
      <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Produk Dress</h1>
        <div>
          <input class="form-control d-inline w-auto" type="text" id="searchFood" placeholder="Cari nama produk.."
            aria-label="Search">
          <button class="btn btn-warning d-inline ms-2" data-bs-toggle="modal" data-bs-target="#addFoodModal">+ Tambah
            Produk</button>
        </div>
      </div>
      <section class="daftar-produk">
        <div class="table-responsive">
          <table class="table table-sm table-hover" id="foodTable">
            <thead>
              <tr>
                <th scope="col">NO</th>
                <th scope="col">GAMBAR</th>
                <th scope="col">NAMA PRODUK</th>
                <th scope="col">KATEGORI</th>
                <th scope="col">JUMLAH</th>
                <th scope="col">HARGA</th>
              </tr>
            </thead>
            <tbody>
              {% for dress in dress %}
              <tr>
                <td>{{ loop.index }}</td>
                <td>
                  {% if dress.image %}
                  <img src="{{ url_for('upload_file', filename=dress.image) }}" class="product-image"
                    alt="Food Image">
                  {% else %}
                  <img src="{{ url_for('static', filename='images/default.png') }}" class="product-image"
                    alt="Default Image">
                  {% endif %}
                </td>
                <td>{{ dress.name }}</td>
                <td>{{ dress.category }}</td>
                <td>{{ dress.quantity }}</td>
                <td>{{ dress.price }}</td>
                <td>
                  <button class="btn btn-sm btn-primary" onclick="editProduct('{{ dress._id }}')">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteProduct('{{ dress._id }}')">Delete</button>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal Tambah Produk dress -->
  <div class="modal fade" id="addFoodModal" tabindex="-1" aria-labelledby="addFoodModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="addFoodForm">
          <div class="modal-header">
            <h5 class="modal-title" id="addFoodModalLabel">Tambah Produk dress</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="foodName" class="form-label">Nama Produk</label>
              <input type="text" class="form-control" id="foodName" name="productName" required>
            </div>
            <div class="mb-3">
              <label for="foodCategory" class="form-label">Kategori</label>
              <input type="text" class="form-control" id="foodCategory" name="productCategory" required>
            </div>
            <div class="mb-3">
              <label for="foodQuantity" class="form-label">Jumlah</label>
              <input type="number" class="form-control" id="foodQuantity" name="productQuantity" required>
            </div>
            <div class="mb-3">
              <label for="foodPrice" class="form-label">Harga</label>
              <input type="number" step="0.01" class="form-control" id="foodPrice" name="productPrice" required>
            </div>
            <div class="mb-3">
              <label for="foodImage" class="form-label">Gambar Produk</label>
              <input type="file" class="form-control" id="foodImage" name="dressImage" accept="image/*">

            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function editProduct(dressId) {
      window.location.href = `/edit-dress/${dressId}`;
    }

    function deleteProduct(dressId) {
      if (confirm('Yakin ingin menghapus produk ini?')) {
        $.ajax({
          url: `/delete-dress/${dressId}`,
          type: 'DELETE',
          success: function (response) {
            if (response.result === 'success') {
              alert('Produk berhasil dihapus');
              location.reload();
            } else {
              alert('Gagal menghapus produk: ' + response.msg);
            }
          },
          error: function () {
            alert('Terjadi kesalahan saat menghapus produk');
          }
        });
      }
    }

    $(document).ready(function () {
      $('#addFoodForm').submit(function (e) {
        e.preventDefault();
        let formData = new FormData(this);
        $.ajax({
          url: '/tambah-dress',
          type: 'POST',
          data: formData,
          processData: false,
          contentType: false,
          success: function (response) {
            if (response.result === 'success') {
              alert('Produk berhasil ditambahkan');
              location.reload();
            } else {
              alert('Gagal menambahkan produk');
            }
          },
          error: function () {
            alert('Terjadi kesalahan saat menambahkan produk');
          }
        });
      });

      $('#searchFood').on('keyup', function () {
        let value = $(this).val().toLowerCase();
        $('#foodTable tbody tr').filter(function () {
          $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
        });
      });
    });
  </script>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-w4C12FtfV7r/5XnxEWztpZ3sZfGJFgJNcYhUfWo9NyoQjL1O8A+JnFNMVfBI/J8E" crossorigin="anonymous">
    </script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</body>

</html>
